name: Nix Check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/state/nix
            /nix/store
          key: nix-lint-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-lint-${{ runner.os }}-

      - name: Check formatting
        run: |
          nix fmt -- .
          if ! git diff --quiet; then
            echo "Files not formatted. Run 'nix fmt' locally and commit."
            git diff
            exit 1
          fi

      - name: Run statix
        run: |
          output=$(nix run .#statix -- check . 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -qi "error:"; then
            exit 1
          fi

      - name: Check for dead code
        run: |
          nix run .#deadnix -- --fail .

      - name: Validate flake
        run: |
          nix flake check --no-build .

  build:
    needs: nix-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [honor, pro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.local/state/nix
            /nix/store
          key: nix-build-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-build-${{ runner.os }}-

      - name: Build ${{ matrix.host }}
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/state/nix
            /nix/store
          key: grype-scan-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            grype-scan-${{ runner.os }}-

      - name: Build system closure
        run: |
          nix build .#nixosConfigurations.honor.config.system.build.toplevel --print-out-paths > toplevel-path.txt

      - name: Get closure paths
        run: |
          nix-store -qR $(cat toplevel-path.txt) > closure-paths.txt

      - name: Install Grype
        run: |
          curl -sSfL https://github.com/anchore/grype/releases/download/v0.79.0/grype_0.79.0_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin

      - name: Run Grype
        run: |
          mkdir -p scan-dir
          while IFS= read -r path; do ln -sf "$path" "scan-dir/$(basename "$path")"; done < closure-paths.txt
          grype dir:scan-dir -o sarif > grype-results.sarif --severity-cutoff low || [ $? -eq 1 ]

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-results.sarif

      - name: Display scan summary
        run: |
          cat grype-results.sarif | grep -o '"level":"[^"]*"' | sort | uniq -c || true

      - name: Check for critical/high vulnerabilities
        run: |
          critical=$(cat grype-results.sarif | grep -c '"critical"' || true)
          high=$(cat grype-results.sarif | grep -c '"high"' || true)
          echo "Critical: $critical, High: $high"
          if [ "$critical" -gt 0 ] || [ "$high" -gt 10 ]; then
            echo "Found critical or many high vulnerabilities"
            exit 1
          fi

name: Security Scan

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [honor, pro]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            cores = 0
            max-jobs = auto

      - name: Cache Nix store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          persist-credentials: false

      - name: Cache Grype database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Build system closure
        id: build
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --print-out-paths > toplevel-path.txt
          echo "toplevel=$(cat toplevel-path.txt)" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ steps.build.outputs.toplevel }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Run Grype scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        id: grype
        with:
          sbom: sbom.spdx.json
          severity-cutoff: medium
          fail-build: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: results.sarif
          category: grype-${{ matrix.host }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-reports-${{ matrix.host }}
          path: |
            sbom.spdx.json
            results.sarif
          retention-days: 30
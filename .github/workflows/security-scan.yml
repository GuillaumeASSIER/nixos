name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRYPE_VERSION: "v0.79.0"
  SYFT_VERSION: "v1.11.0"

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            cores = 0
            max-jobs = auto

      - name: Cache Nix store
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/state/nix
            /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Cache Grype database
        uses: actions/cache@v5
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Build system closure
        run: |
          nix build .#nixosConfigurations.honor.config.system.build.toplevel --print-out-paths > toplevel-path.txt

      - name: Get closure paths
        run: |
          nix-store -qR $(cat toplevel-path.txt) > closure-paths.txt
          wc -l closure-paths.txt

      - name: Install security tools
        run: |
          curl -sSfL https://github.com/anchore/grype/releases/download/${{ env.GRYPE_VERSION }}/grype_${{ env.GRYPE_VERSION }}_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin grype
          curl -sSfL https://github.com/anchore/syft/releases/download/${{ env.SYFT_VERSION }}/syft_${{ env.SYFT_VERSION }}_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin syft

      - name: Generate SBOM
        run: |
          mkdir -p scan-dir
          while IFS= read -r path; do ln -sf "$path" "scan-dir/$(basename "$path")"; done < closure-paths.txt
          syft dir:scan-dir -o spdx-json > sbom.spdx.json
          syft dir:scan-dir -o cyclonedx-json > sbom.cyclonedx.json

      - name: Run Grype scan
        id: grype
        run: |
          set +e
          grype sbom:sbom.spdx.json -o sarif --severity-cutoff low --fail-on medium > grype-results.sarif
          grype_exit=$?
          echo "grype_exit_code=${grype_exit}" >> $GITHUB_OUTPUT
          set -e
          
          if [ ! -s grype-results.sarif ]; then
            echo "::warning::SARIF file empty, creating minimal valid SARIF"
            cat > grype-results.sarif << 'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "Grype",
                  "informationUri": "https://github.com/anchore/grype",
                  "version": "${{ env.GRYPE_VERSION }}"
                }
              },
              "results": []
            }]
          }
          EOF
          fi
          
          echo "SARIF file size: $(wc -c < grype-results.sarif) bytes"

      - name: Validate SARIF
        run: |
          if command -v jq &> /dev/null; then
            if jq empty grype-results.sarif 2>/dev/null; then
              echo "SARIF is valid JSON"
            else
              echo "::error::SARIF is not valid JSON"
              cat grype-results.sarif
              exit 1
            fi
          else
            echo "jq not available, skipping JSON validation"
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            grype-results.sarif
          retention-days: 30

      - name: Display vulnerability summary
        if: always()
        run: |
          if command -v jq &> /dev/null; then
            echo "## Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            total=$(jq '.runs[0].results | length' grype-results.sarif 2>/dev/null || echo "0")
            critical=$(jq '[.runs[0].results[] | select(.level == "critical")] | length' grype-results.sarif 2>/dev/null || echo "0")
            high=$(jq '[.runs[0].results[] | select(.level == "high")] | length' grype-results.sarif 2>/dev/null || echo "0")
            medium=$(jq '[.runs[0].results[] | select(.level == "medium")] | length' grype-results.sarif 2>/dev/null || echo "0")
            low=$(jq '[.runs[0].results[] | select(.level == "low")] | length' grype-results.sarif 2>/dev/null || echo "0")
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $low |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$total** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Vulnerability Counts:** Critical=$critical, High=$high, Medium=$medium, Low=$low"
          else
            grep -o '"level":"[^"]*"' grype-results.sarif | sort | uniq -c || true
          fi

      - name: Fail on critical/high vulnerabilities
        if: steps.grype.outputs.grype_exit_code != '0'
        run: |
          echo "::error::Grype found vulnerabilities with severity >= medium (exit code: ${{ steps.grype.outputs.grype_exit_code }})"
          exit ${{ steps.grype.outputs.grype_exit_code }}
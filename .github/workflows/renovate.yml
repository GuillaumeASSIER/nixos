name: Renovate

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: renovatebot/github-action@v46.1.15
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
